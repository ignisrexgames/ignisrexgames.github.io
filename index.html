<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGNISREX GAMES</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>

    <div class="background"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">
                IGNIS<span>REX</span>GAMES
            </a>

            <ul>
                <li>
                    <a href="index.html">Ana Sayfa</a>
                </li>
                <li>
                    <a href="about.html">Hakkımızda</a>
                </li>
                <li>
                    <a href="games.html">Oyunlar</a>
                </li>
                <li>
                    <a href="contact.html">İletişim</a>
                </li>
            </ul>
        </nav>

     <section class="hero">
            <div class="hero-text">
                <h1>GELECEĞİN OYUNLARINI KEŞFET</h1>
                <p>IGNISREX GAMES olarak yenilikçi, sürükleyici ve eğlenceli mobil deneyimler tasarlıyoruz.</p>
                <a href="games.html" class="button">Oyunları İncele</a>
            </div>

        <div class="hero-logo-container">
            <a href="games.html" class="hero-logo-link">
                <model-viewer
                    id="heroLogo"
                    class="hero-3d-logo"
                    src="logo.glb" 
                    alt="IGNISREX GAMES 3D Logo"
                    auto-rotate
                    rotation-per-second="0deg"
                    disable-zoom
                    interaction-prompt="none"
                    shadow-intensity="1">
                </model-viewer>
            </a>
        </div>
        </section>
    </header>

    <footer>
        © 2026 IGNISREX GAMES
    </footer>

    <script src="script.js"></script>
  <script>
    const logoViewer = document.getElementById('heroLogo');

    // Fare üzerine gelince hem dönmeyi başlat hem hızı ayarla
    logoViewer.addEventListener('mouseenter', () => {
        logoViewer.setAttribute('rotation-per-second', '15deg');
    });

    // Fareyi çekince hızı sıfırla ve yavaşça ilk önüne dön
    logoViewer.addEventListener('mouseleave', () => {
        logoViewer.setAttribute('rotation-per-second', '0deg');
        
        // Kamerayı yumuşakca ilk açısına (0 dereceye) sıfırla
        logoViewer.cameraOrbit = "0deg 75deg 105%";
    });
    </script>
</body>

</html>
