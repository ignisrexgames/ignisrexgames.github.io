</head>

<body>

    <header>

     <section class="hero">
            <div class="hero-text">
                <h1>GELECEĞİN OYUNLARINI KEŞFET</h1>
                <p>IGNISREX GAMES olarak yenilikçi, sürükleyici ve eğlenceli mobil deneyimler tasarlıyoruz.</p>

           <div class="hero-logo-container">
            <a href="games.html" class="hero-logo-link">
                <model-viewer
                    id="heroLogo"
                    class="hero-3d-logo"
                    src="logo.glb" 
                    alt="IGNISREX GAMES 3D Logo"

    </footer>

    <script src="script.js"></script>
   <script>
    const logoViewer = document.getElementById('heroLogo');

    let isReturning = false;

    // Kullanıcı fareyle logoya dokunduğu an (çevirmeye başladığında) geri dönmeyi durdur
    logoViewer.addEventListener('pointerdown', () => {
        isReturning = false;
    });

    // Fareyi logodan çektiğin an yavaşça ilk haline dönme sürecini başlat
    logoViewer.addEventListener('mouseleave', () => {
        isReturning = true;
    });

    function smoothReturn() {
        if (logoViewer && isReturning) {
            const orbit = logoViewer.getCameraOrbit();
            if (orbit) {
                // Hedefimiz her zaman ilk açılış açısı olan 0 (theta)
                let targetTheta = 0;
                
                // Mevcut açıdan 0'a doğru yavaşça (0.05 faktörüyle) yaklaş
                // Bu sayıyı küçülttükçe (örneğin 0.02 yaparsan) daha da yavaş döner
                let newTheta = orbit.theta + (targetTheta - orbit.theta) * 0.05;

                logoViewer.cameraOrbit = `${newTheta}rad 75deg 105%`;

                // Tamamen ilk haline çok yakın bir yere geldiyse durdur
                if (Math.abs(targetTheta - orbit.theta) < 0.005) {
                    isReturning = false;
                }
            }
        }
        requestAnimationFrame(smoothReturn);
    }

    requestAnimationFrame(smoothReturn);
    </script>

</body>
