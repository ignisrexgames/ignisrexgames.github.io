    <script src="script.js" defer></script>
  <script>
    const logoViewer = document.getElementById('heroLogo');

    let angle = 0;
    let isHovered = false; 

    logoViewer.addEventListener('mouseenter', () => {
        isHovered = true;
    });

    logoViewer.addEventListener('mouseleave', () => {
        isHovered = false;
        angle = angle % (2 * Math.PI);
        if (angle > Math.PI) {
            angle -= 2 * Math.PI;
        }
    });

    logoViewer.addEventListener('touchstart', () => {
        isHovered = true;
    });

    logoViewer.addEventListener('touchend', () => {
        isHovered = false;
        angle = angle % (2 * Math.PI);
        if (angle > Math.PI) {
            angle -= 2 * Math.PI;
        }
    });

    function animateLogo() {
        if (logoViewer) {
            if (isHovered) {
                angle += 0.05; 
            } else {
                angle += (0 - angle) * 0.007;
            }
            logoViewer.cameraOrbit = `${angle}rad 75deg 105%`;
        }
        requestAnimationFrame(animateLogo);
    }

    requestAnimationFrame(animateLogo);
    </script>
