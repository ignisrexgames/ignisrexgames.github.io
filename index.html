</head>

<body>

    <div class="background"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">

            <ul>

                    <a href="index.html">Ana Sayfa</a>

     <section class="hero">
            <div class="hero-text">
                <h1>GELECEĞİN OYUNLARINI KEŞFET</h1>
                <p>IGNISREX GAMES olarak yenilikçi, sürükleyici ve eğlenceli mobil deneyimler tasarlıyoruz.</p>
                <a href="games.html" class="button">Oyunları İncele</a>

         <div class="hero-logo-container">
            <a href="games.html" class="hero-logo-link">
                <model-viewer
                    id="heroLogo"
                    class="hero-3d-logo"
                    src="logo.glb" 
                    alt="IGNISREX GAMES 3D Logo"

    <footer>

    </footer>

    <script src="script.js"></script>
   <script>
    const logoViewer = document.getElementById('heroLogo');

    let isHovered = false; // Fare üzerinde mi?
    let currentTheta = 0; // Mevcut dönüş açısı

    // Fare logonun ÜZERİNE GELDİĞİ AN
    logoViewer.addEventListener('mouseenter', () => {
        isHovered = true;
    });

    // Fareyi LOGODAN ÇEKTİĞİN AN
    logoViewer.addEventListener('mouseleave', () => {
        isHovered = false;
    });

    function animateLogo() {
        if (logoViewer) {
            const orbit = logoViewer.getCameraOrbit();
            if (orbit) {
                if (isHovered) {
                    // --- AŞAMA 1: Fare üzerindeyken KENDİ KENDİNE DÖN ---
                    // Buradaki 0.025 sayısını artırırsan daha hızlı döner
                    currentTheta = orbit.theta + 0.025;
                } else {
                    // --- AŞAMA 2: Fare çekilince YAVAŞÇA BAŞA DÖN ---
                    // Hedefimiz 0 (ön yüz). 0.05 sayısını küçülttükçe daha ağır ve yumuşak döner
                    currentTheta += (0 - currentTheta) * 0.05;
                }

                // Kameranın açısını güncelle (theta=yatay, phi=dikey, radius=yakınlık)
                logoViewer.cameraOrbit = `${currentTheta}rad 75deg 105%`;
            }
        }
        // Döngüyü sürekli çalıştır
        requestAnimationFrame(animateLogo);
    }

    // Animasyon döngüsünü başlat
    requestAnimationFrame(animateLogo);
    </script>
</body>
