<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGNISREX GAMES</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>

    <div class="background"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">
                IGNIS<span>REX</span>GAMES
            </a>

            <ul>
                <li>
                    <a href="index.html">Ana Sayfa</a>
                </li>
                <li>
                    <a href="about.html">Hakkımızda</a>
                </li>
                <li>
                    <a href="games.html">Oyunlar</a>
                </li>
                <li>
                    <a href="contact.html">İletişim</a>
                </li>
            </ul>
        </nav>

     <section class="hero">
            <div class="hero-text">
                <h1>GELECEĞİN OYUNLARINI KEŞFET</h1>
                <p>IGNISREX GAMES olarak yenilikçi, sürükleyici ve eğlenceli mobil deneyimler tasarlıyoruz.</p>
                <a href="games.html" class="button">Oyunları İncele</a>
            </div>

       <div class="hero-logo-container">
            <a href="games.html" class="hero-logo-link">
                <model-viewer
                    id="heroLogo"
                    class="hero-3d-logo"
                    src="logo.glb" 
                    alt="IGNISREX GAMES 3D Logo"
                    disable-zoom
                    interaction-prompt="none"
                    shadow-intensity="1">
                </model-viewer>
            </a>
        </div>
        </section>
    </header>

    <footer>
        © 2026 IGNISREX GAMES
    </footer>

    <script src="script.js"></script>
  <script>
    const logoViewer = document.getElementById('heroLogo');

    let angle = 0; // Logonun dönüş açısı
    let isHovered = false; 

    // 1. FARE ÜZERİNE GELDİĞİNDE
    logoViewer.addEventListener('mouseenter', () => {
        isHovered = true;
    });

    // 2. FARE ÇEKİLDİĞİNDE
    logoViewer.addEventListener('mouseleave', () => {
        isHovered = false;
        
        // Logo siz üzerindeyken 10-20 tur atmış olabilir. Çekince deli gibi 
        // 20 tur geriye sarmaması için açıyı 1 tam turun (360 derece) içine sabitliyoruz.
        angle = angle % (2 * Math.PI);
        
        // Hedefe (ön yüze) en kısa ve en mantıklı yoldan dönmesi için:
        if (angle > Math.PI) {
            angle -= 2 * Math.PI;
        }
    });

    function animateLogo() {
        if (logoViewer) {
            if (isHovered) {
                // FARE ÜSTÜNDEYKEN HIZLI DÖNÜŞ: 
                // Buradaki 0.05'i artırırsan (örn: 0.08) çok daha hızlı döner.
                angle += 0.05; 
            } else {
                // FARE ÇEKİLİNCE YAVAŞÇA İLK HALİNE DÖNÜŞ: 
                // Hedef 0 (ön yüz). Buradaki 0.04 sayısı dönüşün yavaşlık/yumuşaklık ayarıdır.
                angle += (0 - angle) * 0.04;
            }

            // Hesaplanmış kusursuz açıyı logoya uygula
            logoViewer.cameraOrbit = `${angle}rad 75deg 105%`;
        }
        
        requestAnimationFrame(animateLogo);
    }

    // Animasyonu başlat
    requestAnimationFrame(animateLogo);
    </script>
</body>

</html>
