<head>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>

    <div class="background"></div>

    <header>
        <nav>
            <a href="index.html" class="logo">
                IGNIS<span>REX</span>GAMES
            </a>

            <ul>
                <li>
                    <a href="index.html">Ana Sayfa</a>
                </li>
                <li>
                    <a href="about.html">Hakkımızda</a>
                </li>
                <li>

                </li>
                <li>
                    <a href="contact.html">İletişim</a>
                </li>
            </ul>
        </nav>

     <section class="hero">
            <div class="hero-text">
                <h1>GELECEĞİN OYUNLARINI KEŞFET</h1>
                <p>IGNISREX GAMES olarak yenilikçi, sürükleyici ve eğlenceli mobil deneyimler tasarlıyoruz.</p>
                <a href="games.html" class="button">Oyunları İncele</a>
            </div>

            <div class="hero-logo-container">
            <a href="games.html" class="hero-logo-link">
                <model-viewer
                    id="heroLogo"
                    class="hero-3d-logo"
                    src="logo.glb" 
                    alt="IGNISREX GAMES 3D Logo"
                    auto-rotate
                    rotation-per-second="15deg"
                    camera-controls
                    disable-zoom
                    shadow-intensity="1">
                </model-viewer>
            </a>
        </div>
        </section>
    </header>

    <footer>
        © 2026 IGNISREX GAMES
    </footer>

    <script src="script.js"></script>
   <script>
    const logoViewer = document.getElementById('heroLogo');

    let speed = 0.015; // Dönüş hızı

    logoViewer.addEventListener('mouseenter', () => {
        speed = 0; // Fare gelince durur
    });

    logoViewer.addEventListener('mouseleave', () => {
        speed = 0.015; // Fare gidince tekrar döner
        // Fareyi çekince logoyu başlangıç açısına sıfırlar
        logoViewer.cameraOrbit = "0deg 75deg 105%"; 
    });

    function rotateLogo() {
        if (logoViewer && speed > 0) {
            const orbit = logoViewer.getCameraOrbit();
            if (orbit) {
                const newTheta = orbit.theta + speed;
                logoViewer.cameraOrbit = `${newTheta}rad ${orbit.phi}rad ${orbit.radius}m`;
            }
        }
        requestAnimationFrame(rotateLogo);
    }

    requestAnimationFrame(rotateLogo);
    </script>

</body>

</html>
