     <section class="hero">

    <script src="script.js"></script>
   <script>
    const logoViewer = document.getElementById('heroLogo');

    let isReturningToFront = false;
    let targetTheta = 0;

    // Kullanıcı fareyle dokunduğunda veya döndürdüğünde otomatik dönmeyi kes
    logoViewer.addEventListener('pointerdown', () => {
        isReturningToFront = false;
    });

    // Fareyi logodan çektiğinde yavaşça ön yüze dönmeye başla
    logoViewer.addEventListener('mouseleave', () => {
        isReturningToFront = true;
        targetTheta = 0; // Hedefimiz ön yüz (0 derece)
    });

    function rotateLogo() {
        if (logoViewer) {
            const orbit = logoViewer.getCameraOrbit();
            if (orbit) {
                if (isReturningToFront) {
                    // Fare çekildikten sonra yavaşça 0'a (ön yüze) doğru kaydır
                    // 0.03 sayısını küçültürsen daha da yavaş döner
                    const newTheta = orbit.theta + (targetTheta - orbit.theta) * 0.03;
                    
                    logoViewer.cameraOrbit = `${newTheta}rad 75deg 105%`;

                    // Tam ön yüze çok yakın bir yere geldiyse durdur
                    if (Math.abs(targetTheta - orbit.theta) < 0.01) {
                        isReturningToFront = false;
                    }
                }
            }
        }
        requestAnimationFrame(rotateLogo);
    }

    requestAnimationFrame(rotateLogo);
    </script>

</body>
