</head>

<body>

    <div class="background"></div>

    <header>
        <nav>

     <section class="hero">
            <div class="hero-text">
                <h1>GELECEĞİN OYUNLARINI KEŞFET</h1>
                <p>IGNISREX GAMES olarak yenilikçi, sürükleyici ve eğlenceli mobil deneyimler tasarlıyoruz.</p>

            <div class="hero-logo-container">
            <a href="games.html" class="hero-logo-link">
                <model-viewer
                    id="heroLogo"
                    class="hero-3d-logo"
                    src="logo.glb" 
                    alt="IGNISREX GAMES 3D Logo"
                    auto-rotate
                    rotation-per-second="15deg"

    </footer>

    <script src="script.js"></script>
   <script>
    const logoViewer = document.getElementById('heroLogo');

    let isHovered = false;
    let currentTheta = 0;

    // Fare üzerine gelince dur
    logoViewer.addEventListener('mouseenter', () => {
        isHovered = true;
    });

    // Fareyi çekince yavaşça ilk haline dönmeye başla
    logoViewer.addEventListener('mouseleave', () => {
        isHovered = false;
    });

    function rotateLogo() {
        if (logoViewer) {
            const orbit = logoViewer.getCameraOrbit();
            if (orbit) {
                if (!isHovered) {
                    // Normalde kendi kendine döner
                    currentTheta = orbit.theta + 0.015;
                } else {
                    // Fare üzerindeyken açıyı yavaşça 0'a (ilk ön yüze) doğru yaklaştır (Yumuşak geçiş)
                    // 0.08 sayısı ne kadar küçük olursa dönüş o kadar yavaş ve yumuşak olur
                    currentTheta += (0 - currentTheta) * 0.08;
                }

                // Kameranın açısını güncelle
                logoViewer.cameraOrbit = `${currentTheta}rad 75deg 105%`;
            }
        }
        requestAnimationFrame(rotateLogo);
    }

    requestAnimationFrame(rotateLogo);
    </script>

</body>
