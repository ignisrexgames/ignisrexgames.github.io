<body>

     <section class="hero">

       <div class="hero-logo-container">

<footer style="text-align: center; padding: 30px; position: relative; z-index: 100; clear: both;">

    <script src="script.js"></script>
  <script>
    const logoViewer = document.getElementById('heroLogo');

    let angle = 0; // Logonun dönüş açısı
    let isHovered = false; 

    // 1. FARE ÜZERİNE GELDİĞİNDE
    logoViewer.addEventListener('mouseenter', () => {
        isHovered = true;
    });

    // 2. FARE ÇEKİLDİĞİNDE
    logoViewer.addEventListener('mouseleave', () => {
        isHovered = false;
        
        // Açıyı 1 tam turun içine sabitle ki geriye sararken saçmalamasın
        angle = angle % (2 * Math.PI);
        
        if (angle > Math.PI) {
            angle -= 2 * Math.PI;
        }
    });

    // Dokunmatik cihazlar (mobil/tablet) için dokunma desteği
    logoViewer.addEventListener('touchstart', () => {
        isHovered = true;
    });

    logoViewer.addEventListener('touchend', () => {
        isHovered = false;
        angle = angle % (2 * Math.PI);
        if (angle > Math.PI) {
            angle -= 2 * Math.PI;
        }
    });

    function animateLogo() {
        if (logoViewer) {
            if (isHovered) {
                // Fare üstündeyken hızlı dönüş (İstediğin gibi canlı hız)
                angle += 0.05; 
            } else {
                // Fare çekilince ÇOK DAHA YAVAŞ ve ağır bir şekilde ilk haline dönüş
                // 0.015 sayısını ne kadar küçültürsen (örn: 0.01) o kadar yavaş döner
                angle += (0 - angle) * 0.007;
            }

            // Hesaplanmış açıyı logoya uygula
            logoViewer.cameraOrbit = `${angle}rad 75deg 105%`;
        }
        
        requestAnimationFrame(animateLogo);
    }

    // Animasyonu başlat
    requestAnimationFrame(animateLogo);
    </script>

</body>
